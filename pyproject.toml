[project]
name = "paleosphere-ai"
version = "0.1.0"
description = "Predator-prey ecosystem simulator for comparing rule-based and RL dinosaur policies"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<2.5",  # 2.5.x DLL이 Windows 애플리케이션 제어에 차단됨 (D-009)
    "pyyaml>=6.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simulator/paleosphere"]

[tool.pytest.ini_options]
testpaths = ["simulator/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["paleosphere", "training", "app"]
