[project]
name = "paleosphere-ai"
version = "0.1.0"
description = "Predator-prey ecosystem simulator for comparing rule-based and RL dinosaur policies"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<2.5",  # 2.5.x DLL이 Windows 애플리케이션 제어에 차단됨 (D-009)
    "pyyaml>=6.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
training = [
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    "torch>=2.4",
    "tensorboard>=2.17",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "onnx>=1.17",
    "scikit-learn>=1.5,<1.8",  # 1.8+ DLL이 Windows 애플리케이션 제어에 차단됨 (D-009와 같은 문제)
]
onnx = [
    "onnxruntime>=1.20",
]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simulator/paleosphere", "training", "inference-server/app"]

[tool.pytest.ini_options]
testpaths = ["simulator/tests", "training/tests", "inference-server/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["paleosphere", "training", "app"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
