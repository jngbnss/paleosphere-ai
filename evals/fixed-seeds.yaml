# 평가 seed 세트. 학습은 train 범위에서만 seed를 뽑는다 (training/environments/predator_env.py).
train:
  range: [0, 10000]
  map: map_a
  note: 학습 전용. 평가에 사용 금지

eval_seen_map:
  seeds: [10000, 10001, 10002, 10003, 10004, 10005, 10006, 10007, 10008, 10009,
          10010, 10011, 10012, 10013, 10014, 10015, 10016, 10017, 10018, 10019]
  map: map_a
  note: 학습에 쓰지 않은 seed, 같은 맵

eval_unseen_map:
  seeds: [20000, 20001, 20002, 20003, 20004, 20005, 20006, 20007, 20008, 20009,
          20010, 20011, 20012, 20013, 20014, 20015, 20016, 20017, 20018, 20019]
  map: map_b
  note: 학습에 쓰지 않은 자원 배치 (물 위치 이동, 식물 -40%)

regression:
  seeds: [42, 777, 2026]
  map: map_a
  note: 결정성·회귀 테스트 (simulator/tests/golden)
