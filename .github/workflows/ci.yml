name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --all-extras
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest -q
      - name: Gymnasium check_env
        run: uv run python -c "from gymnasium.utils.env_checker import check_env; from training.environments import PredatorEnv; check_env(PredatorEnv(max_steps=200), skip_render_check=True); print('check_env ok')"
      - name: PPO smoke training
        run: uv run python -m training.scripts.train_ppo --smoke --run-name ci_smoke
