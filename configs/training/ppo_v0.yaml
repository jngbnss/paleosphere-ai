# PPO v0 하이퍼파라미터 (Stable-Baselines3)
algo: PPO
total_timesteps: 500000
n_envs: 8
map: map_a
reward: v0
max_steps: 2000
ppo:
  learning_rate: 0.0003
  n_steps: 512           # env당 rollout 길이 → 8 env × 512 = 4096 / update
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.01
  clip_range: 0.2
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [64, 64]
eval:
  freq: 100000           # 전체 timestep 기준 (학습 중 평가는 5 seed로 가볍게, 전체 평가는 evaluate.py)
  seeds: [10000, 10001, 10002, 10003, 10004]
