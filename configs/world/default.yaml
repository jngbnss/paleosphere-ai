# map_a: 학습·기본 평가용 월드 설정
map:
  name: map_a
  size: 64.0
  plants:
    count: 10
    radius: 2.5
    max_food: 60.0
    regrow_per_tick: 0.05
  waters:
    - {pos: [16.0, 48.0], radius: 4.0}
    - {pos: [50.0, 14.0], radius: 3.5}
  rocks:
    count: 6
    radius_min: 1.5
    radius_max: 3.0

population:
  herbivore: 8
  predator: 1
  herd_spread: 6.0
  predator_min_distance: 25.0

time:
  day_length: 400
  night_fraction: 0.3
  night_vision_multiplier: 0.6

species:
  herbivore:
    walk_speed: 0.30
    sprint_speed: 0.80
    vision: 14.0
    hunger_rate: 0.05
    thirst_rate: 0.05
    energy_rest_gain: 0.5
    energy_walk_cost: 0.03
    energy_sprint_cost: 0.25
    sprint_thirst_extra: 0.04
    initial_hunger: [20.0, 50.0]
    initial_thirst: [10.0, 40.0]
  predator:
    walk_speed: 0.35
    sprint_speed: 0.95
    vision: 18.0
    hunger_rate: 0.04
    thirst_rate: 0.05
    energy_rest_gain: 0.5
    energy_walk_cost: 0.05
    energy_sprint_cost: 0.5
    sprint_thirst_extra: 0.05
    initial_hunger: [45.0, 55.0]
    initial_thirst: [10.0, 30.0]

metabolism:
  starving_threshold: 100.0     # hunger/thirst가 이 값에 닿으면 체력 감소
  starvation_damage: 0.2
  dehydration_damage: 0.25
  exhaustion_damage: 0.3        # energy 0일 때
  health_regen: 0.05            # hunger, thirst 모두 80 미만일 때
  min_sprint_energy: 5.0
  eat_rate: 0.5                 # 식물 food 소비량 / tick
  hunger_per_food: 2.0          # food 1 = hunger 2 감소
  drink_rate: 3.0               # thirst 감소 / tick

combat:
  attack_range: 1.8
  attack_cooldown: 6
  attack_energy_cost: 2.0
  damage: 50.0
  hit_chance_vs_walking: 0.75
  hit_chance_vs_sprinting: 0.45
  kill_hunger_reduction: 60.0
  kill_energy_gain: 20.0
  give_up_ignore_ticks: 30
